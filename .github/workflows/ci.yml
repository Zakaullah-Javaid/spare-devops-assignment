
name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Start API and PostgreSQL
        run: docker compose up -d

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done

          echo "API did not become healthy in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Test health endpoint
        run: |
          RESPONSE=$(curl --fail --silent --show-error http://localhost:8080/health)
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.status == "ok"'

      - name: Test create user
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST http://localhost:8080/users \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test User"}')

          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.id != null and .name == "CI Test User"'

      - name: Test create notification
        run: |
          USER_RESPONSE=$(curl --fail --silent --show-error \
            -X POST http://localhost:8080/users \
            -H "Content-Type: application/json" \
            -d '{"name":"Notification Test User"}')

          USER_ID=$(echo "$USER_RESPONSE" | jq -er '.id')

          NOTIFICATION_RESPONSE=$(curl --fail --silent --show-error \
            -X POST http://localhost:8080/notifications \
            -H "Content-Type: application/json" \
            -d "{\"user_id\":$USER_ID,\"title\":\"CI Test\",\"body\":\"Test notification from GitHub Actions\"}")

          echo "$NOTIFICATION_RESPONSE"
          echo "$NOTIFICATION_RESPONSE" | jq -e \
            --argjson user_id "$USER_ID" \
            '.user_id == $user_id and .title == "CI Test"'

      - name: Show logs if tests fail
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
